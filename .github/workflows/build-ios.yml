# Builds an unsigned iPhone app (.ipa) on GitHub's Mac computers.
# Install it with Sideloadly (free, Windows or Mac) using any Apple ID.
# Free Apple IDs: the app must be refreshed every 7 days.
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install --clean
        env:
          EXPO_OFFLINE: 1

      - name: Install iOS libraries
        working-directory: ios
        run: pod install

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/"$SCHEME".app || { grep -E "error:" -m 30 xcodebuild.log; exit 1; }

      - name: Package the .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry manhunt.ipa Payload
          ls -l manhunt.ipa

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Manhunt iPhone build ${{ github.run_number }}
          body: |
            iPhone version. Download **manhunt.ipa** on a computer and install it with Sideloadly (free, Windows or Mac).
            Android players: use the latest Android build, not this one.
          files: manhunt.ipa
          make_latest: false
