name: Probe map tiles
on:
  push:
    branches: [main]
    paths: ['scripts/tile-probe.mjs', '.github/workflows/tile-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir /tmp/p && cp scripts/tile-probe.mjs /tmp/p/ && cd /tmp/p && npm init -y >/dev/null && npm i @mapbox/vector-tile@3 pbf@4 >/dev/null 2>&1 && node tile-probe.mjs
