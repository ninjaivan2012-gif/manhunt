# Tests the challenge spot finder on real map data whenever it changes.
name: Check challenge spots

on:
  push:
    branches: [main]
    paths: ['src/game/spots.ts', 'scripts/spots-check.ts', '.github/workflows/spots-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lake Eola Park, Orlando (lake, buildings, paths)
        run: npx --yes tsx scripts/spots-check.ts 28.5434 -81.3730 350
      - name: Suburban neighborhood with ponds, Winter Garden FL
        run: npx --yes tsx scripts/spots-check.ts 28.5653 -81.5862 400
